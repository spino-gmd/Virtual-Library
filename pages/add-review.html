<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Movie Library - Add New Review</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <header>
            <a href="../index.html" class="logo-link">
                <div>
                    <img src="../assets/images/brev-icon.png" alt="BRev Logo Icon" height="96">
                    <span>BRev</span>
                </div>
            </a>

            <nav>
                <button class="add-button" aria-label="Add new book review">+</button>
            </nav>
        </header>

        <main>
            <div class="form-page-container">

    <h2>New Review</h2>
    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="book-name">Book Name</label>
                <input type="text" id="book-name" placeholder="Enter the book title">
            </div>

            <div class="form-group">
                <label for="poster-url">Cape URL</label>
                <input type="text" id="cape-url" placeholder="Paste image URL (jpg or png)">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="rating-select">Stars</label>
                    <select id="rating-select">
                        <option value="">Choose a rating</option>
                        <option value="1">★☆☆☆☆ - 1 Star</option>
                        <option value="2">★★☆☆☆ - 2 Stars</option>
                        <option value="3">★★★☆☆ - 3 Stars</option>
                        <option value="4">★★★★☆ - 4 Stars</option>
                        <option value="5">★★★★★ - 5 Stars</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="read-date">Read Date</label>
                    <input type="date" id="read-date">
                </div>
            </div>

            <div class="form-group">
                <label for="review-text">My Review</label>
                <textarea id="review-text" rows="5" placeholder="Write your thoughts here..."></textarea>
            </div>

            <button type="submit" class="submit-button">Add</button>

        </form>
    </div>
</div>


        </main>

        <footer>
            <p>&copy; 2026 BRev &ndash; My Book Reviews</p>
        </footer>
    </body>

</html>
